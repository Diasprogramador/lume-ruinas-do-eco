name: Testar e publicar Lume
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Instalar Godot 4.6.1
        run: |
          curl --fail --location --retry 3 https://github.com/godotengine/godot/releases/download/4.6.1-stable/Godot_v4.6.1-stable_linux.x86_64.zip -o /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.6.1-stable_linux.x86_64
          echo /tmp/godot >> "$GITHUB_PATH"
          python3 tools/install_templates.py --web-only
      - name: Importar e testar
        run: |
          set -o pipefail
          GODOT=Godot_v4.6.1-stable_linux.x86_64
          $GODOT --headless --path . --editor --import --quit
          for suite in gameplay preferences levels mobile hud_customization; do
            $GODOT --headless --path . --script res://tests/$suite.gd 2>&1 | tee /tmp/test-$suite.log
            if grep -E 'SCRIPT ERROR|^FAIL:|FAIL: ' /tmp/test-$suite.log; then exit 1; fi
          done
      - name: Exportar para navegador
        run: |
          mkdir -p build/web
          touch build/.gdignore
          Godot_v4.6.1-stable_linux.x86_64 --headless --path . --export-release Web build/web/index.html
          cp -r THIRD_PARTY build/web/
          cp assets/fonts/OFL.txt build/web/THIRD_PARTY/Cormorant-OFL.txt
          touch build/web/.nojekyll
          python3 tools/prepare_web.py
      - name: Testar instalação e abertura offline
        run: |
          python3 -m pip install playwright==1.63.0
          python3 -m playwright install --with-deps chromium
          python3 -m http.server 8765 --directory build --bind 127.0.0.1 > /tmp/lume-web.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID"' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8765/web/ > /dev/null; then break; fi
            sleep 1
          done
          python3 tests/web_install.py http://127.0.0.1:8765/web/
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: build/web
  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
